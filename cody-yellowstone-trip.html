  .stop-row{display:flex;align-items:flex-start;gap:.75rem;padding:.75rem .8rem;cursor:pointer}

  .title{font-size:.95rem;font-weight:700;line-height:1.3}

  }

  }

    padding:.5rem .65rem;border-radius:0 .35rem .35rem 0;margin:.4rem 0 .55rem;

  .lookfor b{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pine-deep);display:block;margin-bottom:.2rem}
  .maplink{

    text-decoration:none;border-bottom:1.5px solid #c4d0d7;
  }
  /* ---------- info tab ---------- */
  .infoblock{
    background:var(--card);border:1px solid var(--rule);border-radius:.5rem;
    padding:.9rem .95rem;margin-bottom:.75rem;font-size:.84rem;line-height:1.65;
  }
  .infoblock h3{
    font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pine-deep);
    margin-bottom:.5rem;font-weight:800;
  }
  .infoblock .big{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
  .infoblock ul{list-style:none}
  .infoblock li{padding:.22rem 0 .22rem 1.05rem;position:relative}
  .infoblock li::before{content:"▸";position:absolute;left:0;color:var(--thermal);font-size:.75rem;top:.32rem}
  .kv{display:flex;justify-content:space-between;gap:1rem;padding:.28rem 0;border-bottom:1px dashed var(--rule)}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--mute);font-size:.76rem}
  .kv span:last-child{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  footer{
    text-align:center;font-size:.66rem;color:var(--mute);letter-spacing:.14em;
    text-transform:uppercase;padding:1.6rem 0 .5rem;
  }
  .resetline{text-align:center;margin-top:1rem}
  .resetline button{
    font:inherit;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
    background:none;border:1px solid var(--rule);border-radius:.4rem;padding:.4rem .8rem;cursor:pointer;
  }
  @media (prefers-reduced-motion:no-preference){
    .stop{transition:box-shadow .15s ease,border-color .15s ease}
  }
</style>

const G="https://maps.google.com/?q=";
const DAYS=[
{id:"thu",tab:"THU",sub:"Aug 6",date:"2026-08-06",title:"Travel In",
 meta:"GSP → DEN → COD · <b>land 10:43 PM</b> · sleep: Bleistein",
 stops:[
  {t:"4:15",am:"PM",title:"Depart GSP — UA1866 to Denver",body:"<p>Land DEN 5:55 PM. Offline maps, park app, playlists, and podcasts downloaded before boarding. Grant confirmation screenshot saved to photos: <b>20977608</b>.</p>"},
  {t:"5:55",am:"PM",title:"Denver layover — eat a real dinner",chips:["3 hrs"],body:"<p>Nothing in Cody is open when you land. This is dinner. Board UA5132 at 9:05.</p>"},
  {t:"10:43",am:"PM",title:"Land Cody — ride to the house",chips:["5 min"],body:"<p>Mom's handling the ride (or truck pickup if the Thursday-night plan confirmed). Body clock says 12:43 AM.</p><p>If energized: Walmart run tonight — cooler, ice, water, sandwich stuff, thermos, snacks.</p><a class='maplink' href='"+G+"1822+Bleistein+Ave+Cody+WY'>⌖ 1822 Bleistein Ave</a>"},
  {t:"11:30",am:"PM",title:"Bed. No alarm.",body:"<p>Tomorrow starts when it starts. Errands first, mountains after.</p>"}
 ]},
{id:"fri",tab:"FRI",sub:"Aug 7",date:"2026-08-07",shiftable:true,title:"The High Loop — Beartooth → Lamar",
 meta:"~220 mi · <b>~6 hrs driving</b> · home ~10:15 PM · sleep: Bleistein",
 stops:[
  {t:"7:30",am:"AM",title:"Errands + odometer photo",body:"<p>Bear spray (~$50, Walmart or Sunlight Sports — hip-mounted beyond boardwalks all trip). Cooler provisions. Full tank. <b>Photo of the odometer</b> — 800-mi cap, plan lands ~630.</p>"},
  {t:"8:30",am:"AM",title:"Depart — Chief Joseph Hwy",chips:["55 min"],body:"<p>North on WY-120, west on 296. Fresh chip seal this summer — easy on loose gravel.</p>"},
  {t:"9:25",am:"AM",title:"Dead Indian Pass Overlook",chips:["20 min stop"],body:"<p>Walk it, don't just shoot it. Clarks Fork canyon and Sunlight Basin below — the country the Nez Perce ran in 1877. The wall to the northwest is where you're headed.</p><a class='maplink' href='"+G+"44.7448,-109.3862'>⌖ Open in Maps</a>"},
  {t:"10:15",am:"AM",title:"Beartooth Lake",chips:["→ 45 min","shore walk"],body:"<p>Alpine lake under Beartooth Butte — 500-million-year-old seabed stacked on 3-billion-year-old granite, some of the oldest exposed rock on Earth.</p><a class='maplink' href='"+G+"44.9447,-109.5934'>⌖ Open in Maps</a>"},
  {t:"10:45",am:"AM",title:"Beartooth Pass — 10,947 ft",chips:["→ 20 min","45 min on foot"],wild:"Mountain goats on the crags · pikas squeaking in talus · peak wildflowers · touchable snowfields",body:"<p>The 'another planet' report. Wander off the pullout into the tundra — most people give this four minutes. Can be 45°F and blowing while Cody bakes; the layer lives in the truck.</p><a class='maplink' href='"+G+"44.9705,-109.4655'>⌖ Open in Maps</a>"},
  {t:"11:30",am:"AM",title:"Rock Creek Vista — TURNAROUND",chips:["→ 25 min"],body:"<p>2,000-ft look down the glacial canyon. This is the top of the day — no Red Lodge descent. Retrace west.</p><a class='maplink' href='"+G+"45.0517,-109.4046'>⌖ Open in Maps</a>"},
  {t:"12:40",am:"PM",title:"Cooke City — lunch · GAS · bathroom",chips:["→ 55 min","Miners Saloon"],body:"<p>Sit-down burger, no rush. <b>Last fuel before home.</b> The full pre-Lamar checklist, handled by a frontier town of ~100.</p><a class='maplink' href='"+G+"Miners+Saloon+Cooke+City+MT'>⌖ Open in Maps</a>"},
  {t:"2:00",am:"PM",title:"Northeast Entrance",chips:["→ 25 min"],body:"<p>$35 pass (7 days, keep the receipt) if not already bought. Quietest gate in the park.</p>"},
  {t:"2:45",am:"PM",title:"Trout Lake",chips:["→ 20 min","¾ mi steep","30 min at the water"],wild:"Big cutthroat cruising the shallows · otters (reliable spot) · spray on hip",body:"<p>Steep climb through Douglas fir to absurdly clear water. First real payoff of the Hokas. Sit and watch the fish patrol.</p><a class='maplink' href='"+G+"44.8996,-110.1223'>⌖ Open in Maps</a>"},
  {t:"4:30",am:"PM",title:"LAMAR VALLEY — the evening shift",chips:["→ 15 min","until sunset 8:15"],wild:"Bison herds backlit after 6:30 · pronghorn on the flats · wolves at dusk (the lottery) · grizzly at treeline · scan with grandpa's binoculars",body:"<p>Cruise the valley floor slow, then park where the spotting scopes cluster (pullouts between Slough Creek and Lamar Canyon). Walk up, say 'anything moving?' — they'll share the scope.</p><p>Cooler dinner from the truck bed. Nearly four hours of just being here. This is the most in-the-experience block of the trip.</p><a class='maplink' href='"+G+"44.8977,-110.2245'>⌖ Open in Maps</a>"},
  {t:"8:15",am:"PM",end:"10:15 PM",fixed:true,title:"Depart — Chief Joseph in the dark",chips:["~2 hrs","deer-speed"],body:"<p>Elk own this road at night. Home ~10:15. Tomorrow departs at 6 <i>or</i> 7 — both pre-approved. Pack the small overnight bag before bed.</p>"}
 ]},
{id:"sat",tab:"SAT",sub:"Aug 8",date:"2026-08-08",shiftable:true,title:"Canyon + Washburn → Grant",
 meta:"~140 mi one-way · <b>~3 hr 50 driving</b> · the on-foot day · sleep: <b>Grant Village</b>",
 stops:[
  {t:"6:00",am:"AM",title:"Depart with overnight bag",chips:["6 or 7 — your call"],body:"<p>Big duffel stays at the house. Cooler restocked, daypack loaded: water ×2, lunch, shell, fleece, beanie, headlamp, spray, charger, binoculars.</p>"},
  {t:"7:05",am:"AM",title:"East Entrance + Sylvan Pass",chips:["→ 65 min"],wild:"Grizzly on the Sylvan corridor — one of the park's best roadside bear stretches",body:"<p>Show the pass. If on the early schedule: <b>Lake Butte Overlook</b> spur (+15 min) — whole lake below, and on clear mornings the Tetons on the far southern horizon. Wave hello.</p><a class='maplink' href='"+G+"44.4933,-110.2668'>⌖ Lake Butte Overlook</a>"},
  {t:"8:15",am:"AM",title:"Mud Volcano + Dragon's Mouth",chips:["→ 50 min","full loop ~40 min"],wild:"Dragon's Mouth growling (steam collapsing in the cave) · bison lounging on warm ground",body:"<p>The park's most acidic, gassiest ground. Do the hillside stairs, not just the roadside pots.</p><a class='maplink' href='"+G+"44.6249,-110.4382'>⌖ Open in Maps</a>"},
  {t:"9:15",am:"AM",title:"GRAND CANYON — walked, not driven",chips:["→ 20 min","~2.5 hrs"],wild:"Ospreys nesting on canyon spires · mid-morning rainbows in the falls mist",body:"<p><b>South rim:</b> Artist Point (the postcard — 308-ft falls in yellow-pink hydrothermally cooked rock), then the <b>Point Sublime trail</b> — the ¾-mile 95% of visitors skip.</p><p><b>North rim</b> (10-min drive): Red Rock / Lookout Point, Inspiration Point, then the <b>Brink of the Lower Falls</b> switchbacks — stand on top of the falls as the river goes over under your feet. Steep back up; the Hokas' first real test.</p><a class='maplink' href='"+G+"44.7201,-110.4794'>⌖ Artist Point</a>"},
  {t:"12:15",am:"PM",end:"3:45 PM",title:"Mount Washburn — summit lunch",chips:["→ 12 min","6.4 mi RT","down by 3:30"],wild:"Bighorn sheep near the summit (resident band) · marmots · storm clouds after 2 = descend",body:"<p>~1,400 ft on a wide old road-grade. <b>Eat lunch on top, 30 unhurried minutes</b> — 10,243 ft, the whole park in 360°, Tetons on the horizon.</p><p><i>Sacrifice-order note: skipping the summit entirely is pre-approved. Canyon + early check-in is still a great day. The crown jewel is tomorrow regardless.</i></p><a class='maplink' href='"+G+"44.7796,-110.4494'>⌖ Dunraven Pass trailhead</a>"},
  {t:"4:10",am:"PM",title:"Hayden Valley — golden hour, southbound",chips:["→ 20 min","rolling slow"],wild:"Bison jams (pay the toll happily) · elk + grizzly on far treelines",body:"<p>Windows down through the old lakebed. The dusk pass happens en route — no backtracking.</p>"},
  {t:"5:15",am:"PM",title:"Lake Yellowstone Hotel — porch dinner",chips:["→ 25 min","unhurried"],body:"<p>1891 colonnade, sunroom, sometimes a string quartet. Dinner, not a stop.</p><a class='maplink' href='"+G+"Lake+Yellowstone+Hotel'>⌖ Open in Maps</a>"},
  {t:"7:00",am:"PM",title:"Grant Village — CHECK IN",chips:["→ 35 min","conf 20977608"],body:"<p>Deluxe Lodge, 1 Queen. Check-in desk after 4. Solve tomorrow's coffee tonight (thermos + cooler — nothing opens early).</p><p><b>~10:00 PM: walk to the lakeshore and look up.</b> One of the darkest skies in the lower 48 — the Milky Way core is out. Ten minutes minimum. Then bed.</p><a class='maplink' href='"+G+"24+Rainbow+Loop+Grant+Village+Yellowstone'>⌖ 24 Rainbow Loop</a>"}
 ]},
{id:"sun",tab:"SUN",sub:"Aug 9",date:"2026-08-09",shiftable:true,title:"Geyser Dawn Sweep → Home → Mustangs",
 meta:"~215 mi · <b>~4 hr 15 driving</b> in six short hops · the crown-jewel day · sleep: Bleistein",
 stops:[
  {t:"6:40",am:"AM",title:"Depart Grant",chips:["coffee from thermos"],body:"<p>Checkout is a key-drop. Five minutes to the reason for everything.</p>"},
  {t:"6:45",am:"AM",title:"WEST THUMB — dawn steam",chips:["→ 5 min","~1 hr"],wild:"Black Pool's impossible blue · Abyss Pool · Fishing Cone in the lake · elk browsing basin margins",body:"<p><b>The moment the room bought.</b> Fork RIGHT from the parking path (friend's beta) down to the lakeside walk first. Steam columns off springs draining into the cold lake, low sun across the water, boardwalk empty, ground gurgling.</p><a class='maplink' href='"+G+"44.4166,-110.5732'>⌖ Open in Maps</a>"},
  {t:"8:00",am:"AM",title:"Old Faithful + Upper Geyser Basin",chips:["→ 35 min","~1.5 hrs"],wild:"Beehive Geyser if its indicator's going (better show) · Firehole River steaming",body:"<p>Over Craig Pass — the Continental Divide, twice. Check the eruption board on arrival, walk <b>Geyser Hill</b> while waiting. Then the Inn's 1904 log lobby — 76 feet of lodgepole gothic — and the <b>huckleberry latte</b> at the espresso cart. Buses land ~9:30 as you leave.</p><a class='maplink' href='"+G+"44.4605,-110.8281'>⌖ Open in Maps</a>"},
  {t:"9:50",am:"AM",title:"GRAND PRISMATIC — Fairy Falls Overlook",chips:["→ 15 min","0.6 mi walk","~45 min"],body:"<p>The single most otherworldly color you will ever see outdoors: 370 ft of boiling turquoise ringed in orange — thermophile bacteria mats, each ring a temperature band. Sun's high enough to fire it; the mob is 45 minutes behind you.</p><a class='maplink' href='"+G+"44.5155,-110.8325'>⌖ Fairy Falls trailhead</a>"},
  {t:"10:45",am:"AM",title:"OPTIONAL — Firehole Canyon swim",chips:["→ 15 min","45 min","if open"],body:"<p>Thermally-warmed river in a lava canyon, spur road past Madison. Ask any ranger if the swim area's open (usually by August). Suit's in the truck. Skip freely.</p><a class='maplink' href='"+G+"Firehole+Canyon+Drive+swimming+area'>⌖ Open in Maps</a>"},
  {t:"12:00",am:"PM",title:"NORRIS GEYSER BASIN — both loops",chips:["→ 40 min","~2 hrs"],wild:"Steamboat's runoff channel (world's tallest geyser) · the hiss of Porcelain Basin",body:"<p>The finale — hottest, oldest, most volatile ground in the park. <b>Porcelain Basin first</b>: the alien one, a treeless bowl of vents and milky-blue runoff. Then Back Basin past Steamboat. Artists Paintpots (1-mi loop) is an optional stop en route if ahead of schedule.</p><a class='maplink' href='"+G+"44.7264,-110.7031'>⌖ Open in Maps</a>"},
  {t:"2:15",am:"PM",title:"Homebound — Canyon fuel → Hayden → East gate",chips:["~2 hrs 10 total"],body:"<p>Snack + gas at Canyon Village, one last Hayden pass (bison don't check the clock), out over Sylvan. Cody ~4:50.</p>"},
  {t:"6:00",am:"PM",fixed:true,title:"McCullough Peaks mustangs — golden hour",chips:["→ 25 min","dirt roads","skip if rain"],wild:"Wild horse bands · stallion posturing · foals · banded clay lighting up at dusk",body:"<p>East on 14/16/20 to the BLM two-tracks. The trip's last new landscape — desert badlands, nobody there.</p><a class='maplink' href='"+G+"44.5583,-108.7379'>⌖ Open in Maps</a>"},
  {t:"9:00",am:"PM",fixed:true,title:"Walk downtown — Silver Dollar or Chamberlin",body:"<p>Live music with the wranglers, or the quiet bar where Hemingway signed the register in '32. You've earned either.</p>"}
 ]},
{id:"mon",tab:"MON",sub:"Aug 10",date:"2026-08-10",title:"Heart Mountain + Mom + Rodeo",
 meta:"~50 mi · the landing day · sleep: Bleistein",
 stops:[
  {t:"9:00",am:"AM",title:"Slow morning — coffee, reset",body:"<p>Sleep in. Heart Mountain opens at 10; two shapes for the day depending on mom's exact arrival:</p><p><b>Together (recommended):</b> lunch downtown when she lands, then Heart Mountain 12:30–2:00, Buffalo Bill Center 2:15–5:00.</p><p><b>Solo version:</b> you at Heart Mountain 10:00 sharp, back for her ~11:45.</p>"},
  {t:"11:00",am:"AM",title:"Mom lands",body:"<p>Trip becomes a duet. Old Trail Town (Butch Cassidy's cabin, 30–45 min) fits before lunch if the timing's generous.</p>"},
  {t:"12:30",am:"PM",title:"Heart Mountain Interpretive Center",chips:["→ 20 min","open 10–5","~90 min"],body:"<p>The WWII camp where 14,000 Japanese Americans were held — one of the best small museums in the country, unflinching, under the mountain the prisoners looked at for three years. It'll be the thing you two talk about at dinner.</p><a class='maplink' href='"+G+"Heart+Mountain+Interpretive+Center+Powell+WY'>⌖ Open in Maps</a>"},
  {t:"2:15",am:"PM",title:"Buffalo Bill Center of the West",chips:["→ 20 min","until 5"],body:"<p>Five museums in one. If energy's finite: <b>Plains Indian wing</b> and the <b>Whitney art wing</b> first. Café on site.</p><a class='maplink' href='"+G+"Buffalo+Bill+Center+of+the+West'>⌖ Open in Maps</a>"},
  {t:"5:15",am:"PM",title:"GAS THE TRUCK",chips:["before dinner"],body:"<p>Nothing's open after the rodeo. Fuel now, return per the counter's Monday procedure tonight.</p>"},
  {t:"5:45",am:"PM",title:"Irma Hotel — dinner",chips:["walkable"],body:"<p>Buffalo Bill's own hotel. Prime rib, the cherrywood bar. Maximum Cody, mom-approved.</p><a class='maplink' href='"+G+"Irma+Hotel+Cody+WY'>⌖ Open in Maps</a>"},
  {t:"7:45",am:"PM",title:"Cody Nite Rodeo",chips:["8:00 start","Buzzard's Roost side"],body:"<p>The last night: tundra, wolves-country, canyon, geysers, mustangs — and now a rodeo.</p><a class='maplink' href='"+G+"Cody+Nite+Rodeo'>⌖ Open in Maps</a>"},
  {t:"10:00",am:"PM",title:"Pack + truck return",body:"<p><b>Bear spray stays at the house with a note</b> — it cannot fly, even checked. Leftover cooler food too. Bags zipped tonight.</p>"}
 ]},
{id:"tue",tab:"TUE",sub:"Aug 11",date:"2026-08-11",title:"Travel Home",
 meta:"COD → DEN → EWR → GSP · <b>land 11:03 PM</b>",
 stops:[
  {t:"8:45",am:"AM",title:"Airport — Yellowstone Regional",chips:["mom's ride plan"],body:"<p>An hour early is genuinely plenty at COD.</p>"},
  {t:"10:10",am:"AM",title:"UA5079 → Denver 11:55",body:"<p>Buy real food in Denver — the day is long.</p>"},
  {t:"1:42",am:"PM",title:"UA1505 → Newark 7:35",chips:["⚠ 72-min connection"],body:"<p><b>Check arrival + departure gates before landing. Walk with purpose.</b> If it goes sideways, United's next-morning GSP options are thin — patience is packed.</p>"},
  {t:"8:47",am:"PM",title:"UA3681 → GSP 11:03 PM",body:"<p>Home. Seven kinds of awe in the bag.</p>"}
 ]},
{id:"info",tab:"INFO",sub:"ref",date:null,title:"Reference",meta:"Everything that isn't a stop",info:true}
];

/* ============ STATE ============ */
let state={done:{},open:{},shift:{},tab:null};
function load(){try{const s=localStorage.getItem("cy26");if(s)state={...state,...JSON.parse(s)}}catch(e){}}
function save(){try{localStorage.setItem("cy26",JSON.stringify(state))}catch(e){}}

/* ============ NOW LOGIC ============ */
function todayId(){
  const n=new Date();
  const d=DAYS.find(d=>d.date&&n.toISOString().slice(0,10)===d.date);
  return d?d.id:null;
}
function toMin(t,am){let[h,m]=t.split(":").map(Number);if(am==="PM"&&h!==12)h+=12;if(am==="AM"&&h===12)h=0;return h*60+m}
function fmtMin(m){m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mm=m%60,am=h>=12?"PM":"AM";let hh=h%12||12;return{t:hh+":"+String(mm).padStart(2,"0"),am}}
function shiftStop(s,off){if(!off||s.fixed)return{t:s.t,am:s.am};return fmtMin(toMin(s.t,s.am)+off)}
function dayOff(d){return(state.shift&&state.shift[d.id])||0}
function nowIndex(day){
  const tid=todayId();if(!day.date||day.id!==tid)return -1;
  const n=new Date(),cur=n.getHours()*60+n.getMinutes(),off=dayOff(day);
  let idx=-1;
  day.stops.forEach((s,i)=>{const sh=shiftStop(s,off);if(toMin(sh.t,sh.am)<=cur)idx=i});
  return idx;
}

/* ============ RENDER ============ */
const tabsEl=document.getElementById("tabs"),viewEl=document.getElementById("view");
function renderTabs(){
  tabsEl.innerHTML=DAYS.map(d=>
    `<button class="tab${state.tab===d.id?" active":""}" data-t="${d.id}">${d.tab}<small>${d.sub}</small></button>`
  ).join("");
}
function endLabel(d,s,i,off,sam){
  let et,eam;
  if(s.end!==undefined){
    if(s.end==="")return "";
    [et,eam]=s.end.split(" ");
    if(off&&!s.fixed){const f=fmtMin(toMin(et,eam)+off);et=f.t;eam=f.am}
  }else{
    const nx=d.stops[i+1];
    if(!nx)return "";
    const f=shiftStop(nx,off);et=f.t;eam=f.am;
  }
  return `<em>${et}${eam!==sam?`<small>${eam}</small>`:""}</em>`;
}
function stopHTML(d,s,i,isNow){
  const key=d.id+"-"+i,done=state.done[key],open=state.open[key],off=dayOff(d);
  const sh=shiftStop(s,off);
  const chips=(s.chips||[]).map(c=>`<span class="chip${c.includes("min")||c.includes("hr")?" drive":""}">${c}</span>`).join("");
  const wild=s.wild?`<div class="lookfor"><b>Look for</b>${s.wild}</div>`:"";
  return `<div class="stop${done?" done":""}${open?" open":""}${isNow?" now":""}" data-k="${key}">
    <div class="stop-row">
      <div class="time">${sh.t}<small>${sh.am}</small>${endLabel(d,s,i,off,sh.am)}</div>
      <div class="stop-main">
        <div class="title">${s.title}${isNow?'<span class="nowtag">NOW</span>':""}</div>
        ${chips?`<div class="chips">${chips}</div>`:""}
      </div>
      <div class="check" data-c="${key}">✓</div>
    </div>
    <div class="body">${wild}${s.body||""}</div>
  </div>`;
}
function renderDay(d){
  if(d.info)return renderInfo();
  const ni=nowIndex(d),off=dayOff(d);
  let shiftRow="";
  if(d.shiftable){
    const opts=[[0,"On plan"],[30,"+30 min"],[60,"+1 hr"],[90,"+1½ hr"],[120,"+2 hr"]];
    shiftRow=`<div class="shiftrow">`+opts.map(([v,l])=>{
      const f=fmtMin(toMin(d.stops[0].t,d.stops[0].am)+v);
      return `<button class="sh${off===v?" active":""}" data-sh="${v}" data-day="${d.id}">${l}<br><span style="font-weight:500;font-size:.64rem">start ${f.t}${f.am==="AM"?"a":"p"}</span></button>`;
    }).join("")+`</div><div class="shnote">Slept in? Pick a shift — every time below moves with it. Sunset-tied stops stay put.</div>`;
  }
  return `<div class="dayhead"><h2>${d.title}</h2><div class="meta">${d.meta}</div>${shiftRow}</div>`+
    d.stops.map((s,i)=>stopHTML(d,s,i,i===ni)).join("");
}
function renderInfo(){
  return `
  <div class="dayhead"><h2>Reference</h2><div class="meta">Bookings, orders, and the daypack</div></div>
  <div class="infoblock"><h3>Grant Village — Sat Aug 8</h3>
    <div class="kv"><span>Confirmation</span><span class="big">20977608</span></div>
    <div class="kv"><span>Room</span><span>Deluxe Lodge · 1 Queen (ADA roll-in shower)</span></div>
    <div class="kv"><span>Check-in / out</span><span>after 4:00 PM / by 11:00 AM</span></div>
    <div class="kv"><span>Rate</span><span>$321 + tax (~$370)</span></div>
    <div class="kv"><span>Address</span><span>24 Rainbow Loop, YNP</span></div>
    <div class="kv"><span>Lodges line</span><span>307-344-7311</span></div>
  </div>
  <div class="infoblock"><h3>Sacrifice order — pre-signed, zero guilt</h3>
    <ul><li>Trout Lake · Paintpots · Firehole swim — drop freely</li>
    <li>Lake Butte spur + the 6 AM start (7 is fine)</li>
    <li>Washburn summit — canyon-only Saturday is still a great day</li>
    <li><b>Nothing else.</b> Lamar, Grant, the dawn sweep, and mom day are the trip.</li></ul>
  </div>
  <div class="infoblock"><h3>Standing orders</h3>
    <ul><li>Tank above half · gas at Cooke City (Fri), Canyon (Sun), Cody (always)</li>
    <li>Bear spray on hip beyond boardwalks · stays in Cody with a note on the 10th</li>
    <li>No cotton on mountain days · layers for 40° dawns → 90° afternoons</li>
    <li>Text mom the day's shape each morning before losing signal</li>
    <li>Storms build after 2 PM — summit early, descend when clouds stack</li>
    <li>Dark drives at deer-speed: Chief Joseph (Fri), Wapiti (any late return)</li>
    <li>Odometer photo at pickup · cap 800 mi · plan ~630</li>
    <li>Thermopolis = rain card (~170 mi RT — check the cushion first)</li></ul>
  </div>
  <div class="infoblock"><h3>Daypack loadout</h3>
    <ul><li>Water ×2 · lunch · rain shell · fleece · beanie</li>
    <li>Headlamp (fresh batteries) · bear spray · portable charger</li>
    <li>Grandpa's binoculars · swimsuit + small towel (Sunday)</li></ul>
  </div>
  <div class="infoblock"><h3>Numbers & backups</h3>
    <ul><li>Xanterra lodges (Grant changes): 307-344-7311</li>
    <li>Cody cab number: <i>save before flying — Uber runs thin at 10:43 PM</i></li>
    <li>Rental counter: confirm Thu-night pickup + Mon-night drop</li>
    <li>Park emergencies: 911 works from developed areas · signal islands at Canyon, Lake, Grant, Old Faithful</li></ul>
  </div>
  <div class="resetline"><button id="reset">Reset all checkmarks</button></div>`;
}
function render(){
  renderTabs();
  const d=DAYS.find(x=>x.id===state.tab)||DAYS[0];
  viewEl.innerHTML=renderDay(d);
}

/* ============ EVENTS ============ */
tabsEl.addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  state.tab=b.dataset.t;save();render();window.scrollTo({top:0});
});
viewEl.addEventListener("click",e=>{
  if(e.target.id==="reset"){state.done={};save();render();return}
  const sh=e.target.closest(".sh");
  if(sh){state.shift[sh.dataset.day]=Number(sh.dataset.sh);save();render();return}
  const c=e.target.closest(".check");
  if(c){const k=c.dataset.c;state.done[k]=!state.done[k];save();render();return}
  if(e.target.closest("a"))return;
  const s=e.target.closest(".stop");
  if(s){const k=s.dataset.k;state.open[k]=!state.open[k];save();render()}
});

/* ============ INIT ============ */
load();
if(!state.tab)state.tab=todayId()||"fri";
render();
/* refresh the NOW marker every minute while open */
setInterval(()=>{const d=DAYS.find(x=>x.id===state.tab);if(d&&d.date===((new Date).toISOString().slice(0,10)))render()},60000);
</script>
