<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Griffin Duffey</title>
  <meta name="description" content="Griffin Bennett Duffey — design engineer, musician, founder.">
  <link rel="icon" type="image/png" href="/assets/fav.png">
  <link rel="apple-touch-icon" href="/assets/webclip.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="page-layout home">
    <aside class="site-nav" data-include="/partials/nav.html"></aside>

    <section class="home-icons">
      <button class="desktop-icon" type="button" data-open-dialog="reading">
        <img src="/assets/globe.gif" alt="" class="desktop-icon-image">
        <span class="desktop-icon-label">what i'm currently reading</span>
      </button>

      <button class="desktop-icon" type="button" data-open-dialog="listening">
        <img src="/assets/musical-notes.gif" alt="" class="desktop-icon-image">
        <span class="desktop-icon-label">what i'm currently listening to</span>
      </button>
    </section>

    <dialog class="dialog" id="dialog-reading">
      <form method="dialog" class="dialog-close-form">
        <button class="dialog-close" type="submit" aria-label="Close">×</button>
      </form>
      <h2 class="dialog-title">currently reading</h2>
      <div data-widget="currently-reading">
        <!-- Books injected at build time from Goodreads RSS -->
      </div>
    </dialog>

    <dialog class="dialog" id="dialog-listening">
      <form method="dialog" class="dialog-close-form">
        <button class="dialog-close" type="submit" aria-label="Close">×</button>
      </form>
      <h2 class="dialog-title">top albums (past month)</h2>
      <div data-widget="top-albums">
        <!-- Albums injected at build time from Last.fm -->
      </div>
    </dialog>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/lastfm.js"></script>
</body>
</html>
